[project]
name = "llm-personal-finetuning"
version = "0.1.0"
description = "Reproducible, zero-cost QLoRA fine-tuning and evaluation pipeline for a personal-profile QA dataset."
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Notebook cells use IPython shell magics (!pip, !git), which are not valid Python.
extend-exclude = ["notebooks", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
