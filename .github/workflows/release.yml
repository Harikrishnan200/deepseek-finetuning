name: release

# Packages the reproducibility artifacts for a tagged release.
# Still CPU-only: model weights live on the Hugging Face Hub, not in GitHub releases.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint and test
        run: |
          ruff check .
          pytest -q

      - name: Collect release artifacts
        run: |
          mkdir -p release
          # Reports and configs only - never data/raw/ or data/processed/.
          cp -r configs release/
          for f in data/reports/*.json data/reports/*.md \
                   artifacts/evaluation/final_report.md \
                   artifacts/evaluation/*.json \
                   artifacts/training/run_metadata.json \
                   artifacts/training/training_history.json; do
            [ -f "$f" ] && cp "$f" release/ || true
          done
          [ -d artifacts/evaluation/plots ] && cp -r artifacts/evaluation/plots release/ || true
          ls -R release
          tar -czf release-artifacts.tar.gz release

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts.tar.gz

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts.tar.gz
          generate_release_notes: true
          body: |
            Evaluation reports and reproducibility metadata for this tag.

            The LoRA adapter itself is distributed via the Hugging Face Hub, not here.
            The personal dataset is never published.
